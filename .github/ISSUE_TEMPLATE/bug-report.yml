name: Bug report
description: Report a reproducible problem with @xkid1/webauthn.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Security issue?** (for example a response that verifies when it shouldn't, or a check that can be bypassed) Don't open a public issue. Report it privately instead; see [SECURITY.md](https://github.com/xkid1/webauthn/blob/main/SECURITY.md).

        **Never paste secrets.** Leave out private keys, session tokens, API keys and real user handles or emails. Challenges, credential IDs and public keys from a *test* account are fine.

        Please search [existing issues](https://github.com/xkid1/webauthn/issues?q=is%3Aissue) first.

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npm ls @xkid1/webauthn`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: Entry point
      multiple: true
      options:
        - '@xkid1/webauthn/client (browser / Electron)'
        - '@xkid1/webauthn/server'
        - '@xkid1/webauthn/android (React Native / Credential Manager)'
        - '@xkid1/webauthn (root)'
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What goes wrong?
      multiple: true
      options:
        - Registration (create / verifyRegistrationResponse)
        - Authentication (get / verifyAuthenticationResponse)
        - Options generation / config
        - Attestation (none, packed, fido-u2f, tpm, android-key, apple, …)
        - Origin / rpId / apk-key-hash handling
        - Challenge store
        - Conditional UI / autofill / abort
        - Serialisation (base64url, JSON)
        - TypeScript types
        - Installation / packaging / runtime support
        - Other
    validations:
      required: true

  - type: input
    id: error
    attributes:
      label: WebAuthnError code
      description: The `code` of the thrown `WebAuthnError`, or the DOMException name from the browser.
      placeholder: ORIGIN_MISMATCH, NotAllowedError, …

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A link to a small repository is best. Otherwise paste the smallest code that shows the
        problem: your config (rpId, origins, attestation, userVerification) and the call that
        fails. A test-account response JSON helps a lot for verification bugs.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and stack trace.
    validations:
      required: true

  - type: input
    id: authenticator
    attributes:
      label: Authenticator
      placeholder: YubiKey 5 (USB), iCloud Keychain, Google Password Manager, Windows Hello, 1Password…
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Browser / runtime and OS
      placeholder: Chrome 142 on macOS 15, Node 24, Bun 1.3, React Native 0.82 on Android 16…
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Other environment details
      description: Bundler, TypeScript version, framework, Electron version, and anything unusual (iframes, cross-origin, related origins, custom ChallengeStore).
