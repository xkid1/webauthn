name: Feature request
description: Suggest an improvement or a new capability.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The package has zero runtime dependencies and runs unchanged in browsers, Node, Bun,
        Deno, Electron and React Native. Its security checks are never relaxed by default:
        a new option may *add* strictness or offer an explicit opt-in, but can't weaken a
        default. Proposals that fit within that are the easiest to accept.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Client ceremonies (browser / Electron)
        - Server verification
        - Android Credential Manager bridge
        - New platform or runtime (iOS, Capacitor, Tauri, …)
        - Attestation format or trust chains
        - Extensions (credProps, prf, largeBlob, …)
        - Algorithms / COSE
        - Challenge store or config
        - TypeScript types
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to build, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The option or API you'd like, with a short usage example. Link the spec section (WebAuthn L3, CTAP2, COSE) if relevant.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other libraries that solve this.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
