name: Question or other request
description: Ask how to use the library, or raise something not covered by the other forms.
title: '[Question]: '
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        The [README](https://github.com/xkid1/webauthn#readme) covers the client, server and
        Android entry points, configuration, error codes and the full API reference. It may
        already answer your question.

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Usage / how do I...?
        - Server setup (rpId, origins, challenge store)
        - Passkeys in the browser / Electron
        - Android / React Native
        - Attestation and trust
        - TypeScript
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Question or request
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Relevant code, versions or links. Never paste private keys, tokens or real user data.
      render: typescript
