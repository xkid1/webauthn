# Groups the auto-generated release notes (`gh release create --generate-notes`
# in workflows/release.yml) by the labels that labeler.yml and Dependabot apply.
# A PR goes in the first category whose labels it matches.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Dependencies
      labels:
        - dependencies
    - title: Client
      labels:
        - client
    - title: Server
      labels:
        - server
    - title: Android
      labels:
        - android
    - title: Protocol and attestation
      labels:
        - protocol
        - attestation
    - title: Types and utilities
      labels:
        - types
        - utils
        - source
    - title: Documentation
      labels:
        - documentation
    - title: Tests and benchmarks
      labels:
        - tests
        - e2e
        - benchmarks
    - title: CI and tooling
      labels:
        - ci
        - tooling
    - title: Other changes
      labels:
        - '*'
